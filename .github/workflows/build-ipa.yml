name: Build IPA for TrollStore (iOS 15 Native Swift)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native-swift-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xcodegen & ldid
        run: |
          brew install xcodegen ldid

      - name: Generate Xcode Project from project.yml
        run: |
          cd ios-native
          xcodegen generate

      - name: Build Xcode Archive (Native SwiftUI - iOS 15 Target)
        run: |
          xcodebuild clean archive \
            -project ios-native/VovinamHocThuoc.xcodeproj \
            -scheme VovinamHocThuoc \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VovinamHocThuoc.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0

      - name: Package Native IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -R build/VovinamHocThuoc.xcarchive/Products/Applications/VovinamHocThuoc.app Payload/
          
          # Fake-sign using ldid for TrollStore sandbox bypass
          ldid -S Payload/VovinamHocThuoc.app/VovinamHocThuoc || true
          
          # Create IPA archive
          zip -r9 VovinamHocThuoc.ipa Payload
          ls -lh VovinamHocThuoc.ipa

      - name: Upload Native Swift IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VovinamHocThuoc-NativeSwift-iOS15
          path: VovinamHocThuoc.ipa
          retention-days: 14
