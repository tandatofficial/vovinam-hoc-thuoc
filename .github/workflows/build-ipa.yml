name: Build IPA for TrollStore (iOS 15 Native Swift)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-swift-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install xcodegen & ldid
        run: |
          brew install xcodegen ldid

      - name: Generate Xcode Project from project.yml
        run: |
          cd ios-native
          xcodegen generate
          sed -i '' 's/objectVersion = 77/objectVersion = 56/g' VovinamHocThuoc.xcodeproj/project.pbxproj

      - name: Build Native SwiftUI App Binary (iOS 15 Release)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ios-native/VovinamHocThuoc.xcodeproj \
            -scheme VovinamHocThuoc \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 2>&1 | tee xcodebuild.log || (cat xcodebuild.log && exit 1)

      - name: Package Native IPA for TrollStore
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/DerivedData -name "VovinamHocThuoc.app" -type d | head -n 1)
          echo "Found compiled app bundle at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          
          # Fake-sign binary using ldid for TrollStore installation
          ldid -S Payload/VovinamHocThuoc.app/VovinamHocThuoc || true
          
          # Create IPA archive
          zip -r9 VovinamHocThuoc.ipa Payload
          ls -lh VovinamHocThuoc.ipa

      - name: Save Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add -f xcodebuild.log
          git commit -m "chore: save xcodebuild log"
          git push -f origin build-logs

      - name: Upload Native Swift IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VovinamHocThuoc-NativeSwift-iOS15
          path: VovinamHocThuoc.ipa
          retention-days: 14

      - name: Create or Update GitHub Release for 1-Click Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-native-swift
          name: "Vovinam Học Thuộc v2.0 (Native Swift - iOS 15)"
          body: |
            ### 📱 Vovinam Học Thuộc — Bản Native Swift (iOS 15 - 18)
            - **100% Native SwiftUI**: Loại bỏ hoàn toàn WebKit/Capacitor, khởi động tức thì, không bị lỗi màn hình trắng trên iOS 15.
            - **Giọng đọc Apple Linh vi-VN**: Sử dụng native AVSpeechSynthesizer offline siêu mượt mà.
            - **Hết Hardcode**: Dữ liệu lưu trữ động trong Documents dưới dạng JSON, hỗ trợ Xuất / Nhập / Tùy biến.
            - **Đã sửa dứt điểm nút Đặt lại**: Hoạt động reactive ngay lập tức.
            - **Cài đặt TrollStore**: Tải file `VovinamHocThuoc.ipa` trực tiếp về iPhone và mở bằng TrollStore.
          files: VovinamHocThuoc.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
